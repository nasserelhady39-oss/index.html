<!doctype html>

<head>

  <title>LUMERA — Modern Furniture</title>
  <style>
    :root { color-scheme: dark; --gold:#d7c39a; --muted:#9d978b; --bg:#111110; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; overflow-x:hidden; padding:48px 22px; color:#f4f0e8; background:radial-gradient(ellipse at 50% 34%, #292722 0%, #191917 38%, var(--bg) 76%); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    main { width:min(100%, 440px); text-align:center; }
    .brand { direction:ltr; margin-bottom:58px; opacity:0; animation:rise 950ms cubic-bezier(.2,.7,.2,1) 120ms forwards; }
    .brand-name { margin:0; color:#eee8da; font-family:Georgia,"Times New Roman",serif; font-size:clamp(3.25rem, 15vw, 5.7rem); font-style:italic; font-weight:600; letter-spacing:0; line-height:1.08; text-shadow:0 0 38px #d7c39a20; }
    .brand-tag { margin:18px 0 0; color:var(--gold); font-size:.71rem; letter-spacing:.42em; font-weight:500; }
    h2 { margin:0 0 24px; color:#e8e3d8; font-size:1.05rem; font-weight:400; letter-spacing:.02em; opacity:0; animation:rise 800ms ease 700ms forwards; }
    .links { display:grid; gap:13px; }
    .social { position:relative; isolation:isolate; display:flex; align-items:center; gap:17px; min-height:66px; padding:0 20px; overflow:hidden; color:#eeeae2; text-decoration:none; text-align:right; border:1px solid #c9b98c42; border-radius:13px; background:linear-gradient(110deg,#ffffff0a,#ffffff02 48%,#d8c49a08); box-shadow:0 9px 28px #00000020,inset 0 1px #ffffff0a; transition:transform 240ms ease,border-color 240ms ease,box-shadow 240ms ease,background 240ms ease; opacity:0; animation:rise 720ms cubic-bezier(.2,.7,.2,1) forwards; }
    .social:nth-child(1){animation-delay:950ms}.social:nth-child(2){animation-delay:1080ms}.social:nth-child(3){animation-delay:1210ms}.social:nth-child(4){animation-delay:1340ms}
    .social::before { content:""; position:absolute; z-index:-1; inset:0; transform:translateX(-115%); background:linear-gradient(105deg,transparent 28%,#e7d5ac16 50%,transparent 72%); transition:transform 650ms ease; }
    .social:hover { transform:translateY(-3px); border-color:#d7c39a9c; background-color:#d7c39a08; box-shadow:0 14px 34px #0005,0 0 22px #d7c39a0d; }
    .social:hover::before { transform:translateX(115%); }
    .social:active { transform:translateY(-1px) scale(.99); }
    .social:focus-visible { outline:2px solid var(--gold); outline-offset:4px; }
    .icon { width:25px; height:25px; flex:none; color:var(--gold); }
    .label { flex:1; font-size:.96rem; font-weight:500; letter-spacing:.02em; }
    .arrow { color:#93876e; font-size:1.05rem; transition:transform 220ms ease,color 220ms ease; }
    .social:hover .arrow { transform:translateX(-3px); color:var(--gold); }
    @keyframes rise { from { opacity:0; transform:translateY(15px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } .brand,h2,.social { opacity:1; transform:none; } }
  </style>
</head>
